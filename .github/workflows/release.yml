name: Releaser

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish BugHQ release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged version
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify version and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bun -e 'const pkg = await Bun.file("package.json").json(); if (pkg.name !== "bughq" || "v" + pkg.version !== process.env.RELEASE_TAG) throw new Error("Tag must match the BugHQ manifest");'
          # Buddy can publish while the tag-triggered workflow is starting.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              || gh release view "$RELEASE_TAG"
          fi
