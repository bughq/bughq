name: CI

on:
  push:
    branches:
      - main # deploys to prod

    tags:
      - '*-beta.*' # ensures it is deployed to stage in case `main`` is not pushed to

  pull_request:
    branches:
      - main # deploys to dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx --bun tsc --noEmit

      # `tsc` above never opens a .stx file, so without this nothing checks the
      # script blocks or the {{ }} expressions that make up most of this app.
      #
      # This gate was warnings-only until stx 0.2.176. On 0.2.175 a glob run
      # could not report a type error at all: tsc skips semantic checking for
      # the whole program when any file has a syntax error, so one unparseable
      # block muted every other file, and `0 error(s)` across 38 files meant
      # nothing (stacksjs/stx#1924). 0.2.176 fixed it, the same run reported 407,
      # and Phase A took that to 0 — so errors are now load-bearing and fail the
      # build.
      #
      # --lib is required and must be a SINGLE file: the checker does not read
      # ambient types from tsconfig `include`, and repeating the flag silently
      # drops all but the last (stacksjs/stx#1926). That is why the SSR globals
      # share types/domain.d.ts instead of living in a file of their own.
      #
      # Warnings still fail too. The only one this emits is "values reach this
      # block on the implicit bridge and are untyped" — how a server value
      # reaches client code unchecked, which is the class behind several real
      # bugs here. `stx typecheck` exits 0 on warnings and has no
      # --fail-on-warning, hence the grep; errors it exits non-zero for, which
      # `set -o pipefail` propagates through the tee.
      - name: Typecheck .stx
        run: |
          set -o pipefail
          bunx --bun stx typecheck 'resources/**/*.stx' --lib types/domain.d.ts | tee /tmp/stx-typecheck.log
          if ! grep -qE '0 error\(s\), 0 warning\(s\)' /tmp/stx-typecheck.log; then
            echo "::error::stx typecheck is not clean — see the log above"
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test

  publish-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish Commit
        run: ./storage/framework/scripts/publish-commit
