name: CI

on:
  push:
    branches:
      - main # deploys to prod

    tags:
      - '*-beta.*' # ensures it is deployed to stage in case `main`` is not pushed to

  pull_request:
    branches:
      - main # deploys to dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx --bun tsc --noEmit

      # This gate is for the BRIDGE WARNING, not for type errors. Be precise
      # about that, because the name suggests more than it delivers.
      #
      # `tsc` above never opens a .stx file, so nothing checks the script blocks
      # or the {{ }} expressions that make up most of this app. `stx typecheck`
      # does — but only in single-file mode. Measured on stx 0.2.175, cache
      # cleared between runs, with one deliberate `const x: number = "str"`
      # planted in a client block:
      #
      #   stx typecheck resources/views/dashboard.stx   -> 46 error(s)
      #   stx typecheck 'resources/**/*.stx'            ->  0 error(s)
      #
      # Same file, same planted error, and the glob includes it. So a glob run
      # reporting "0 errors" says nothing about type errors, and single-file
      # mode over-reports instead (it loses project context and invents
      # Cannot-find-name errors), so neither is usable as an error gate yet.
      # Filed as stacksjs/stx#1924; revisit and tighten this when it lands.
      #
      # The WARNING path does work in glob mode, and was verified by sabotage:
      # removing one defineClientPayload takes it 0 -> 1 warning and fails this
      # step, restoring it passes. That warning is "values reach this block on
      # the implicit bridge and are untyped", which is exactly how a server
      # value reaches client code unchecked — the class behind several real bugs
      # here. `stx typecheck` has no --fail-on-warning, hence the grep.
      - name: Typecheck .stx (bridge warnings)
        run: |
          set -o pipefail
          bunx --bun stx typecheck 'resources/**/*.stx' --lib types/domain.d.ts | tee /tmp/stx-typecheck.log
          if ! grep -qE '0 warning\(s\)' /tmp/stx-typecheck.log; then
            echo "::error::stx typecheck reported warnings — declare bridge values with defineClientPayload"
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test

  publish-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish Commit
        run: ./storage/framework/scripts/publish-commit
